[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bijou-portfolio"
version = "2.0.0"
description = "Multi-Echelon Impact & Causal Graph Engine with Air-Gapped Web UI & Python SDK"
readme = "README.md"
authors = [
    { name = "smsiebe" }
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=0.10.0",
    "networkx>=3.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "selenium>=4.20.0",
]

[project.urls]
Homepage = "https://github.com/smsiebe/bijou"
Repository = "https://github.com/smsiebe/bijou.git"
"Bug Tracker" = "https://github.com/smsiebe/bijou/issues"

[project.scripts]
bijou = "bijou.cli:main"
bijou-ingest = "bijou.sdk.ingest_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bijou = ["web/static/*"]
