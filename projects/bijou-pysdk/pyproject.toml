[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bijou-pysdk"
version = "0.1.0"
description = "Lightweight Python client SDK for the Bijou Causal Graph & Tech Tree Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bijou Architecture Team" },
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bijou_sdk"]

