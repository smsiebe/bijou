[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bijou-doc-ingest"
version = "0.1.0"
description = "Batch Document and Telemetry Ingestion Utility for Bijou"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bijou Architecture Team" },
]
dependencies = [
    "bijou-pysdk",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bijou_ingest"]
